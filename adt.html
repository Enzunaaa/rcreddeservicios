<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADT Alarmas | RC Red de Servicios</title>

    <meta
        name="description"
        content="Conocé los kits de ADT Alarmas disponibles para Córdoba y el resto del país."
    >

    <link
        rel="stylesheet"
        href="adt.css"
    >
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="adt-header">

        <div class="adt-header-inner">

            <a
                href="index.html"
                class="adt-logo"
            >
                RC RED DE SERVICIOS
            </a>

            <a
                href="index.html"
                class="back-link"
            >
                ← Volver
            </a>

        </div>

    </header>


    <!-- =====================================================
         CONTENEDOR PRINCIPAL
    ====================================================== -->

    <main class="adt-main">


        <!-- =================================================
             PANTALLA UBICACIÓN
        ================================================== -->

        <section
            id="location-screen"
            class="screen active"
        >

            <div class="screen-content">

                <span class="eyebrow">
                    ADT ALARMAS
                </span>

                <h1>
                    Elegí dónde estás
                </h1>

                <p class="intro">
                    Seleccioná tu ubicación para mostrarte
                    los kits disponibles para tu zona.
                </p>


                <div class="location-grid">


                    <!-- CÓRDOBA -->

                    <button
                        class="location-card"
                        data-location="cordoba"
                    >

                        <div class="location-icon">
                            🏠
                        </div>

                        <div>

                            <h2>
                                Provincia de Córdoba
                            </h2>

                            <p>
                                Ver kits disponibles
                                para Córdoba
                            </p>

                        </div>

                        <span class="arrow">
                            →
                        </span>

                    </button>


                    <!-- RESTO DEL PAÍS -->

                    <button
                        class="location-card"
                        data-location="resto-pais"
                    >

                        <div class="location-icon">
                            🇦🇷
                        </div>

                        <div>

                            <h2>
                                Resto del país
                            </h2>

                            <p>
                                Ver kits disponibles
                                para otras provincias
                            </p>

                        </div>

                        <span class="arrow">
                            →
                        </span>

                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             PANTALLA KITS
        ================================================== -->

        <section
            id="kits-screen"
            class="screen"
        >

            <div class="screen-content wide">


                <button
                    id="back-location"
                    class="back-button"
                >
                    ← Cambiar ubicación
                </button>


                <div class="section-heading">

                    <span
                        id="location-label"
                        class="eyebrow"
                    >
                        ADT ALARMAS
                    </span>

                    <h1>
                        Elegí tu kit
                    </h1>

                    <p>
                        Conocé qué incluye cada solución
                        de seguridad.
                    </p>

                </div>


                <div
                    id="kits-grid"
                    class="kits-grid"
                >
                    <!-- Los kits se generan mediante JavaScript -->
                </div>

            </div>

        </section>


        <!-- =================================================
             PANTALLA DETALLE
        ================================================== -->

        <section
            id="detail-screen"
            class="screen"
        >

            <div class="screen-content detail-container">


                <button
                    id="back-kits"
                    class="back-button"
                >
                    ← Volver a los kits
                </button>


                <div
                    id="kit-detail"
                    class="kit-detail"
                >
                    <!-- El contenido se genera mediante JS -->
                </div>

            </div>

        </section>


    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="adt-footer">

        <p>
            © <span id="current-year"></span>
            RC Red de Servicios
        </p>

        <p>
            ADT Alarmas
        </p>

    </footer>


    <script src="adt.js"></script>

</body>
</html>
